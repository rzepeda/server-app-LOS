version: 1
name: server-app-los
image: ghcr.io/rzepeda/server-app-los:main
container_name: srv-server-app-los
container_port: 8000

public:
  enabled: true
  subdomain: los  # Quedará accesible en https://los.agentictools.uk

healthcheck:
  path: /health

database:
  postgres: true
  name: los

secrets:
  required:
    - OPENAI_API_KEY

apk:
  enabled: true
  container_path: /app/app-release.apk
